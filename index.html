<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel · Uziel Malach</title>
<style>
  :root{ --bg:#0b1220; --card:#111c2e; --line:#1e2d47; --txt:#e8eef7; --dim:#8fa3bf; --gold:#d4af6a; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px 16px 60px}
  .wrap{max-width:860px;margin:0 auto}
  h1{font-size:20px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px}
  h1 span{color:var(--gold)}
  .sub{color:var(--dim);font-size:13px;margin-bottom:24px}
  .sec{margin:28px 0 12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
  .n{font-size:30px;font-weight:600;line-height:1}
  .lbl{color:var(--dim);font-size:12px;margin-top:6px}
  .funil div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
  .funil div:last-child{border:0}
  .funil b{font-weight:600}
  .vazio{color:var(--dim);font-size:14px;padding:18px;background:var(--card);border:1px dashed var(--line);border-radius:10px}
  .rod{margin-top:34px;color:var(--dim);font-size:12px;text-align:center}
</style>
</head>
<body><div class="wrap">
  <h1>Uziel <span>Malach</span></h1>
  <div class="sub">Painel da operação · atualiza sozinho quando os agentes rodam</div>

  <div class="sec">Funil do Mapa da Alma</div>
  <div id="funil"></div>

  <div class="sec">Stories</div>
  <div id="stories"></div>

  <div class="sec">Anúncios</div>
  <div id="ads"></div>

  <div class="rod" id="rod">—</div>
</div>
<script>
const $=id=>document.getElementById(id);
const vazio=t=>`<div class="vazio">${t}</div>`;
const carrega=async f=>{ try{ const r=await fetch(f+'?t='+Date.now()); if(!r.ok) return null; return await r.json(); }catch(e){ return null; } };

(async()=>{
  const d=await carrega('dados.json');
  if(!d||!d.funil){ $('funil').innerHTML=vazio('Ainda sem dados. O relatório grava aqui no fim do dia.'); }
  else{
    $('funil').innerHTML='<div class="card funil">'+d.funil.map(f=>
      `<div><span>${f.rotulo||f.etapa}</span><b>${f.n}</b></div>`).join('')+'</div>';
  }

  const s=await carrega('stories.json');
  if(!s){ $('stories').innerHTML=vazio('Ainda sem postagem registrada.'); }
  else{
    const sl=['manha','tarde','noite'].map(k=>
      `<div class="card"><div class="n">${(s[k]&&String(s[k]).startsWith('postado'))?'✓':'—'}</div><div class="lbl">${k}</div></div>`).join('');
    $('stories').innerHTML=`<div class="grid">${sl}</div>`;
  }

  const a=await carrega('dados_anuncios.json');
  if(!a){ $('ads').innerHTML=vazio('Ainda sem campanha rodando.'); }
  else{
    $('ads').innerHTML=`<div class="grid">
      <div class="card"><div class="n">${a.ativos??'—'}</div><div class="lbl">anúncios ativos</div></div>
      <div class="card"><div class="n">${a.conversas_total??'—'}</div><div class="lbl">conversas</div></div>
      <div class="card"><div class="n">R$ ${a.gasto_total??'—'}</div><div class="lbl">investido</div></div></div>`;
  }

  const q=[d,s,a].filter(Boolean).map(x=>x.gerado_em||x.data).filter(Boolean).sort().pop();
  $('rod').textContent = q ? 'Última atualização: '+q : 'Aguardando a primeira rodada dos agentes';
})();
</script></body></html>
